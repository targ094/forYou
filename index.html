<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For You</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #1a1c2c, #4a192c, #ff9a9e);
        height: 100vh;
        font-family: "Dancing Script", cursive;
        overflow: hidden;
      }

      /* Image1.png Styling */
      .decorative-image {
        position: fixed;
        bottom: 10px;
        right: 80px; /* Right se thoda andar shifted */
        width: 400px; /* Size thoda bada rakha hai */
        z-index: 5; /* Snow pile ke piche ya upar adjust kar sakte hain */
        pointer-events: none;
      }

      /* Twinkling Stars */
      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        opacity: 0.5;
        animation: twinkle var(--duration) infinite ease-in-out;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      #heart-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        padding: 14px 28px;
        cursor: pointer;
        background: #ffb6c1;
        color: white;
        border: none;
        border-radius: 16px;
        box-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
        z-index: 100;
        transition: 0.3s;
      }

      .message-container {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 9999;
        width: 90%;
        max-width: 500px;
      }

      .message-box {
        position: relative;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(8px);
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        font-size: 28px;
        line-height: 1.4;
        color: #720026;
        border: 1px solid rgba(255, 255, 255, 0.5);
        min-height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .message-gif {
        position: absolute;
        top: -70px;
        /* bottom: 50px; */
        left: -70px;
        width: 120px;
        pointer-events: none;
        filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.2));
      }

      .final-gif {
        width: 100%;
        max-width: 600px;
        border-radius: 30px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
        margin-bottom: 20px;
      }

      .again-btn {
        margin-top: 30px;
        font-size: 22px;
        padding: 12px 30px;
        background: #ff4d6d;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-family: "Dancing Script", cursive;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }

      .again-btn:disabled {
        background: #ffb6c1;
        cursor: default;
      }

      /* Snow Styles */
      .snowflake {
        position: fixed;
        top: -10px;
        color: white;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        z-index: 10;
        pointer-events: none;
      }

      #snow-pile {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 0px;
        background: white;
        box-shadow: 0 -20px 30px 10px white;
        z-index: 20;
        transition: height 0.3s ease;
        border-radius: 50% 50% 0 0 / 20% 20% 0 0;
      }

      @keyframes fall {
        to {
          transform: translateY(105vh);
        }
      }
    </style>
  </head>

  <body>
    <img src="image1.png" alt="Decoration" class="decorative-image" />

    <button id="heart-button">Click karo ✨</button>

    <audio id="bg-music" loop>
      <source src="audio.mp3" type="audio/mpeg" />
    </audio>

    <div id="snow-pile"></div>

    <div id="message-container" class="message-container" style="display: none">
      <div id="normal-view">
        <div class="message-box" id="message-text"></div>
        <img id="message-gif" class="message-gif" src="" alt="gif" />
        <button id="next-btn" class="again-btn" onclick="nextMessage()">
          aage kro buddhu ✨
        </button>
      </div>

      <div id="final-view" style="display: none">
        <img src="im11.gif" class="final-gif" alt="Final Surprise" />
        <br />
        <button class="again-btn" onclick="resetCycle()">Play Again 🔄</button>
      </div>
    </div>

    <script>
      const messages = [
        "Dear Kogi,\nWhen I met you for the first time, I had lied. I lied about everything — my identity, my intentions and my promises. I thought it would end in a few weeks...",
        "Par main ruka. Aur mujhe khud nahi pata kyun. Shayad aapki baaton me, aapki hasi me, ya aapki simplicity me kuch tha jo mujhe jaane hi nahi deta tha.",
        "Every day, you came a little closer. And every day, I got a little more scared. Scared that I might rely on you so much that even the thought of you leaving would freeze me.",
        "I’m still scared sometimes. But you are like the rising sun to my night. Every day with you is something I’m grateful for — har din, without fail.",
        "You cheer me up when I’m down. You take care of me in ways no one ever has. But more than anything, you make me shine — you make me feel seen.",
        "I care about you so much. Mujhe aapki bahut parva hai. I love taking care of you. I love all that you are — and even more than that.",
        "You, my kuchupuchu, are truly one of a kind. You’re so buddhu, and that’s what makes you special. Kabhi kabhi lagta hai aap bachchi ho... and yeah, you are.",
        "Yes, you do make my blood boil sometimes. Okay — almost every day. When you don’t take care of yourself, it really upsets me.",
        "But can I stay angry at you? Never. You’re my princess after all. Sometimes I wish I were a boy, so I could be everything you need.",
        "But maybe that doesn’t matter. I can still make you happy. And you? You’ve already made me so happy just by existing on this planet.",
      ];

      const gifs = [
        "im1.gif",
        "im2.gif",
        "im3.gif",
        "im4.gif",
        "im5.gif",
        "im6.gif",
        "im7.gif",
        "im8.gif",
        "im9.gif",
        "im10.gif",
      ];

      let currentIndex = 0;
      let isTyping = false;
      let pileHeight = 0;

      // Stars creation
      for (let i = 0; i < 50; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.width = star.style.height = Math.random() * 3 + "px";
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 70 + "vh";
        star.style.setProperty("--duration", Math.random() * 3 + 2 + "s");
        document.body.appendChild(star);
      }

      document
        .getElementById("heart-button")
        .addEventListener("click", function () {
          this.remove();
          document.getElementById("bg-music").play();
          document.getElementById("message-container").style.display = "block";
          startSnowing();
          typeEffect();
        });

      function typeEffect() {
        if (currentIndex >= messages.length) {
          document.getElementById("normal-view").style.display = "none";
          document.getElementById("final-view").style.display = "block";
          return;
        }

        isTyping = true;
        document.getElementById("next-btn").disabled = true;
        const textElement = document.getElementById("message-text");
        const gifElement = document.getElementById("message-gif");

        textElement.innerHTML = "";
        gifElement.src = gifs[currentIndex];

        let i = 0;
        const fullText = messages[currentIndex];

        function type() {
          if (i < fullText.length) {
            textElement.innerHTML += fullText.charAt(i);
            i++;
            setTimeout(type, 40); // Typing speed
          } else {
            isTyping = false;
            document.getElementById("next-btn").disabled = false;
          }
        }
        type();
      }

      function nextMessage() {
        if (!isTyping) {
          currentIndex++;
          typeEffect();
        }
      }

      function resetCycle() {
        currentIndex = 0;
        document.getElementById("final-view").style.display = "none";
        document.getElementById("normal-view").style.display = "block";
        typeEffect();
      }

      function startSnowing() {
        setInterval(createSnowflake, 150);
      }

      function createSnowflake() {
        const flake = document.createElement("div");
        flake.className = "snowflake";
        flake.innerHTML = "❄";
        const duration = Math.random() * 4 + 3;
        flake.style.left = Math.random() * window.innerWidth + "px";
        flake.style.opacity = Math.random();
        flake.style.fontSize = Math.random() * 1.5 + 0.5 + "em";
        flake.style.animation = `fall ${duration}s linear forwards`;
        document.body.appendChild(flake);
        setTimeout(() => {
          flake.remove();
          if (pileHeight < 70) {
            pileHeight += 0.2;
            document.getElementById("snow-pile").style.height =
              pileHeight + "px";
          }
        }, duration * 1000);
      }
    </script>
  </body>
</html>
